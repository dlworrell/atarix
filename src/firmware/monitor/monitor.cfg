# ld65 layout for the 64 KiB ATARIX boot ROM (ATX-SPEC-022 EP-A).
# The file maps to $FF0000-$FFFFFF. The last 8 KiB is mirrored at
# $00E000-$00FFFF, and the code is linked for that bank-0 window.
MEMORY {
    LOW:  start = $0000, size = $E000, type = ro, fill = yes, fillval = $FF, file = %O;
    ROM:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro;
    VECTORS: load = ROM, type = ro, start = $FFE0;
}
