name: Verified reviewed change (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-change-atx
  cancel-in-progress: false
jobs:
  publish-reviewed-change:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'dlworrell'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish exact reviewed tree and verify GitHub signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PAYLOAD_SHA256: 2f0a62c51fb5d1bca806d538671ae7c9cc8c0a9191c2a554cd511f0b3ff025fc
        run: python3 .github/signing-repair/publish.py
