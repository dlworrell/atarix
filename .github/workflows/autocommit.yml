name: Autocommit

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autocommit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Propose changed files as a verified pull request
        # ADR-0006: no direct pushes to main; automation commits must be verified.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_signed_pr.py \
            --branch automation/autocommit \
            --title "Autocommit generated updates" \
            .
