name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test signed report publication
        run: python3 -m unittest discover -s tests -p 'test_publish_signed_pr.py' -v

      - name: Install GNU build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            m4

      - name: Bootstrap
        run: sh bootstrap

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make check
