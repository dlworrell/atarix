name: Document authority census

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - docs/engineering/reports/document-authority-census.md
      - docs/engineering/reports/document-authority-census.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate full-tree census
        run: |
          mkdir -p docs/engineering/reports
          python3 scripts/document_authority_census.py . \
            --repo-name dlworrell/atarix \
            --format markdown > docs/engineering/reports/document-authority-census.md
          python3 scripts/document_authority_census.py . \
            --repo-name dlworrell/atarix \
            --format json > docs/engineering/reports/document-authority-census.json

      - name: Upload census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atarix-document-authority-census
          path: |
            docs/engineering/reports/document-authority-census.md
            docs/engineering/reports/document-authority-census.json

      - name: Propose census update as a verified pull request
        # ADR-0006: no direct pushes to main; automation commits must be verified.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_signed_pr.py \
            --branch automation/document-authority-census \
            --title "audit(atarix): update document authority census" \
            docs/engineering/reports/document-authority-census.md \
            docs/engineering/reports/document-authority-census.json

      - name: Enforce approved documentation locations
        run: |
          python3 scripts/document_authority_census.py . \
            --repo-name dlworrell/atarix \
            --strict
