# ld65 layout for the 8 KiB CPU-card test ROM at $00E000-$00FFFF.
MEMORY {
    ROM:  start = $E000, size = $1FE0, type = ro, fill = yes, fillval = $FF, file = %O;
    VEC:  start = $FFE0, size = $0020, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro;
    VECTORS: load = VEC, type = ro;
}
